<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartLift AI | Know the wait. Make the choice.</title>
    <meta name="description" content="Help hostel students understand lift waiting patterns by collecting real waiting-time observations." />
  </head>
  <body>
    <div id="error-overlay" style="display:none; padding: 20px; background: #fee; color: #c00; font-family: monospace; white-space: pre-wrap; position: absolute; inset: 0; z-index: 9999;"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-overlay').textContent += e.message + '\n' + (e.error ? e.error.stack : '') + '\n\n';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-overlay').textContent += e.reason + '\n\n';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
